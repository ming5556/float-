name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/floatapp app/src/main/res/values

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            '' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            '' \
            'rootProject.name = "Float"' \
            'include(":app")' \
            > settings.gradle.kts
          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application") version "8.10.1" apply false' \
            '}' \
            > build.gradle.kts
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.nonTransitiveRClass=true' \
            > gradle.properties
          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application")' \
            '}' \
            '' \
            'android {' \
            '    namespace = "com.example.floatapp"' \
            '    compileSdk = 35' \
            '' \
            '    defaultConfig {' \
            '        applicationId = "com.example.floatapp"' \
            '        minSdk = 24' \
            '        targetSdk = 35' \
            '        versionCode = 1' \
            '        versionName = "1.0"' \
            '    }' \
            '' \
            '    signingConfigs {' \
            '        create("release") {' \
            '            val keystorePath = System.getenv("SHELL_KEYSTORE_FILE")' \
            '            val storePassEnv = System.getenv("SHELL_KEYSTORE_PASSWORD")' \
            '            if (!keystorePath.isNullOrBlank() && !storePassEnv.isNullOrBlank()) {' \
            '                storeFile = file(keystorePath)' \
            '                storePassword = storePassEnv' \
            '                keyAlias = System.getenv("SHELL_KEY_ALIAS")' \
            '                keyPassword = System.getenv("SHELL_KEY_PASSWORD")' \
            '            }' \
            '        }' \
            '    }' \
            '' \
            '    buildTypes {' \
            '        release {' \
            '            isMinifyEnabled = false' \
            '            val rc = signingConfigs.getByName("release")' \
            '            signingConfig = if (rc.storeFile != null) rc else null' \
            '        }' \
            '    }' \
            '' \
            '    lint {' \
            '        checkReleaseBuilds = false' \
            '    }' \
            '' \
            '    compileOptions {' \
            '        sourceCompatibility = JavaVersion.VERSION_17' \
            '        targetCompatibility = JavaVersion.VERSION_17' \
            '    }' \
            '}' \
            > app/build.gradle.kts
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '' \
            '    <application' \
            '        android:label="@string/app_name"' \
            '        android:theme="@android:style/Theme.Material.Light.NoActionBar">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '' \
            '</manifest>' \
            > app/src/main/AndroidManifest.xml
          printf '%s\n' \
            'package com.example.floatapp;' \
            '' \
            'import android.app.Activity;' \
            'import android.os.Bundle;' \
            'import android.widget.TextView;' \
            '' \
            'public class MainActivity extends Activity {' \
            '' \
            '    @Override' \
            '    protected void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '        TextView textView = new TextView(this);' \
            '        textView.setText("Float");' \
            '        textView.setTextSize(24f);' \
            '        setContentView(textView);' \
            '    }' \
            '}' \
            > app/src/main/java/com/example/floatapp/MainActivity.java
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <string name="app_name">Float</string>' \
            '</resources>' \
            > app/src/main/res/values/strings.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate signing secrets
        env:
          SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
          SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
          SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
          SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "== 校验签名 Secret =="
          [ -n "${SHELL_KEYSTORE_BASE64:-}" ] || { echo "ERROR: SHELL_KEYSTORE_BASE64 为空"; exit 1; }
          [ -n "${SHELL_KEYSTORE_PASSWORD:-}" ] || { echo "ERROR: SHELL_KEYSTORE_PASSWORD 为空"; exit 1; }
          [ -n "${SHELL_KEY_ALIAS:-}" ] || { echo "ERROR: SHELL_KEY_ALIAS 为空"; exit 1; }
          [ -n "${SHELL_KEY_PASSWORD:-}" ] || { echo "ERROR: SHELL_KEY_PASSWORD 为空"; exit 1; }
          KSFILE="$RUNNER_TEMP/release.jks"
          if ! printf '%s' "$SHELL_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KSFILE" 2>/dev/null; then
            echo "ERROR: SHELL_KEYSTORE_BASE64 不是合法 Base64"
            exit 1
          fi
          SIZE=$(wc -c < "$KSFILE")
          echo "keystore 字节数: $SIZE"
          if [ "$SIZE" -lt 3000 ]; then
            echo "ERROR: 解码后的密钥库太小，SHELL_KEYSTORE_BASE64 可能被截断"
            exit 1
          fi
          if ! keytool -list -keystore "$KSFILE" -storepass "$SHELL_KEYSTORE_PASSWORD" -alias "$SHELL_KEY_ALIAS" > /dev/null 2>&1; then
            echo "ERROR: 密钥库密码或别名不匹配（检查 SHELL_KEYSTORE_PASSWORD / SHELL_KEY_ALIAS）"
            exit 1
          fi
          echo "Secret 校验通过，别名: $SHELL_KEY_ALIAS"
          keytool -list -keystore "$KSFILE" -storepass "$SHELL_KEYSTORE_PASSWORD" -alias "$SHELL_KEY_ALIAS" -v 2>/dev/null | grep -E "SHA256:" || true
          echo "SHELL_KEYSTORE_FILE=$KSFILE" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
          SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
          SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "gradle 退出码: $status"
          if [ "$status" -ne 0 ]; then
            echo "==================== BUILD FAILED ===================="
            grep -n -E "FAILURE|What went wrong|Execution failed|Caused by|error:|Exception" build.log | head -n 40 || true
            echo "==================== LAST 40 LINES ===================="
            tail -n 40 build.log
            echo "==================== END ===================="
            if ls app/build/outputs/apk/release/*.apk > /dev/null 2>&1; then
              echo "已检测到 APK 文件，继续验证与上传"
            else
              exit "$status"
            fi
          fi

      - name: Verify signature
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: float-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
